# ==============================================================================
# UdaanHer Nginx Virtual Host Configuration for AWS EC2 (Host-level Nginx)
# Location on Ubuntu: /etc/nginx/sites-available/udaanher
# (Enable via: sudo ln -s /etc/nginx/sites-available/udaanher /etc/nginx/sites-enabled/)
# ==============================================================================

# Rate limiting zone (optional, protects against burst DDOS attacks)
limit_req_zone $binary_remote_addr zone=udaanher_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your EC2 Elastic IP or domain (e.g., udaanher.org www.udaanher.org)

    # Path to Vite static distribution build
    root /var/www/udaanher/client/dist;
    index index.html;

    # Maximum file upload size for any future attachments
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Reverse Proxy for Backend REST API
    location /api/ {
        limit_req zone=udaanher_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static Assets Caching (1 Year cache for hashed assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. SPA Frontend Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Let's Encrypt ACME Challenge (for Certbot SSL issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

